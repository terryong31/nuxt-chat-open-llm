name: Bug Report
description: Create a report to help us reproduce and fix a bug.
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the component where the bug occurs.
      options:
        - "apps/server (Python / MLX Inference Server)"
        - "apps/web (Nuxt 4 Chat UI)"
        - "packages/ (Shared Python packages)"
        - "Repository / CI / Tooling"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary & Context
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'make dev'
        2. Send payload to '/v1/chat/completions'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: Describe what you expected to happen vs what actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & System Info
      description: Provide system details (macOS chip model, Python, uv, Bun versions, MLX checkpoint used).
      placeholder: |
        - OS: macOS (Apple Silicon M-series)
        - Python version: 3.14
        - uv version: 0.11.x
        - Bun version: 1.x
        - Model Checkpoint: mlx-community/Mamba-Codestral-7B-v0.1-4bit
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any relevant terminal logs or tracebacks here.
      render: shell
