name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    # macOS, not ubuntu: mlx ships arm64-only wheels, so arm64 macOS runners are required.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen fails if uv.lock is stale rather than quietly re-resolving
      - run: uv sync --frozen

      # --check, not --fix: CI reports, the pre-commit hook fixes.
      - run: uv run ruff format --check server/api server/llm

      - run: uv run ruff check server/api server/llm

      # Run pytest if tests directory exists in server/api or server/llm
      - name: Test
        run: |
          if [ -d server/api/tests ] || [ -d server/llm/tests ]; then uv run pytest; fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck
