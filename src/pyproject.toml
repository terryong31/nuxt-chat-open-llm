[project]
name = "local-llm"
version = "0.1.0"
description = "High-performance Apple Silicon Local LLM API using FastAPI & MLX"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=7.0.0",
    "fastapi>=0.141.1",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "mlx-lm>=0.31.3",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.3",
    "trafilatura>=2.2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
local-llm = "local_llm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_llm"]
