[tool.uv.workspace]
# Listed explicitly rather than `apps/*`: that glob matches apps/web, and uv
# errors on a workspace member without a pyproject.toml. The Python and
# JavaScript halves of this repo cannot share one glob.
members = ["server/api", "server/llm", "packages/*"]

[tool.uv]
required-version = ">=0.11"

[dependency-groups]
# Tooling shared by every Python member. `uv sync` installs this by default;
# a deployment uses `--no-dev`.
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "pytest-asyncio>=1",
    "lefthook>=2.1.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["server/api/tests", "server/llm/tests"]
asyncio_mode = "auto"
