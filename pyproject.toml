[project]
name = "local-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=7.0.0",
    "fastapi>=0.141.1",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "mlx-lm>=0.31.3",
    "python-dotenv>=1.2.3",
    "trafilatura>=2.2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
local-llm = "local_llm:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
