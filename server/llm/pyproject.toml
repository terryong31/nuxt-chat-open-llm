[project]
name = "llm-engine"
version = "0.1.0"
description = "OpenAI-compatible LLM inference engine microservice on MLX"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mlx-lm>=0.31.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
]

[project.scripts]
llm-engine = "llm_engine.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "llm_engine"
