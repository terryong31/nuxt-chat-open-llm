[project]
name = "api-server"
version = "0.1.0"
description = "Application API / BFF Gateway Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "pydantic-settings>=2.14.2",
    "supabase>=2.10.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.28.1",
    # LangGraph agent
    "langgraph>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    # DuckDuckGo web search
    "duckduckgo-search>=8.0",
    # pgvector via supabase postgres
    "vecs>=0.4",
]

[project.scripts]
api-server = "app.main:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"
